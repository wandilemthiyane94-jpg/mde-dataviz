<title>Who Owns the Flood: Version 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One deliberate dark look, same palette and faces as the story site. The film is drawn on one 1920x1080 canvas. */
:root{--ground:#05090C;--panel:#101920;--ink:#E6EDEF;--muted:#8C9DA6;--rule:#22313A;--water:#58B7EA;--camp:#F4B942;--hit:#FF5B4F;color-scheme:dark}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.4 "IBM Plex Mono",Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;box-sizing:border-box;overflow-x:hidden}
#stage{position:relative;width:min(100%,calc((100vh - 110px) * 16 / 9));aspect-ratio:16/9;max-width:100%}
canvas{display:block;width:100%;height:100%;background:#05090C;border:1px solid var(--rule)}
#poster{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,9,12,.72);text-align:center}
#poster[hidden]{display:none!important}
#poster h1{font:700 clamp(34px,7vw,92px)/.95 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;margin:0 0 10px}
#poster p{font:clamp(14px,1.6vw,20px)/1.4 Newsreader,Georgia,serif;color:var(--muted);margin:0 0 22px}
#poster button,.bar button{font:500 13px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ground);background:var(--water);border:0;border-radius:3px;padding:12px 20px;cursor:pointer}
.bar{width:min(100%,calc((100vh - 110px) * 16 / 9));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.bar button{padding:8px 12px}
.bar button:focus-visible,#poster button:focus-visible,.chaps button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px}
#scrub{flex:1 1 240px;accent-color:var(--water)}
.chaps{display:flex;flex-wrap:wrap;gap:6px;width:min(100%,calc((100vh - 110px) * 16 / 9))}
.chaps button{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--rule);border-radius:3px;padding:6px 8px;cursor:pointer}
.chaps button.on{color:var(--ink);border-color:var(--muted)}
</style>

<div id="stage">

      <button type="button" id="go">Play film</button>
    </div>
  </div>
</div>

</div>
<div class="chaps" id="chaps"></div>

<script>
(function(){
"use strict";
/* ============================================================================================
   WHO OWNS THE FLOOD — the film. Every mark is drawn from project data:
   tra-story-data.js (84 sites, eThekwini floodplain, exposure test), film-data.js (JRC GSW occurrence
   raster, 300 random Durban points, the 408-case LPRH frame), world-test-data.js (64 coded cases + tests).
   The renderer is stateless: frame(T) draws the film at time T, so scrubbing and recording are exact.
   ============================================================================================ */
const cv=document.getElementById("c"), ctx=cv.getContext("2d"), W=1920, H=1080;
const COL={bg:"#05090C",panel:"#101920",ink:"#E6EDEF",muted:"#8C9DA6",rule:"#22313A",water:"#58B7EA",sea:"#163047",plain:"#2F79AD",camp:"#F4B942",hit:"#FF5B4F",ok:"#5ED69C",unk:"#56666F",landDry:"#1C2328",landWet:"#12232D",rnd:"#6E7F89"};
const DISP="'Barlow Condensed','Arial Narrow',sans-serif", BODY="Newsreader,Georgia,serif", MONO="'IBM Plex Mono',Consolas,monospace";
const clamp=(x,a,b)=>Math.max(a===undefined?0:a,Math.min(b===undefined?1:b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const E=(t,a,b)=>ease(seg(t,a,b));
const lerp=(a,b,k)=>a+(b-a)*k;
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const fadeIO=(t,a,b,f)=>Math.min(seg(t,a,a+(f||.6)),1-seg(t,b-(f||.6),b));
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return "rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+a+")";}

/* ---------- text ---------- */
function text(s,x,y,o){o=o||{};if((o.alpha===undefined?1:o.alpha)<=0.001)return 0;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=o.alpha===undefined?1:o.alpha;
  ctx.font=(o.weight||400)+" "+(o.size||28)+"px "+(o.font||BODY);ctx.fillStyle=o.color||COL.ink;ctx.textAlign=o.align||"left";ctx.textBaseline=o.base||"alphabetic";
  if("letterSpacing" in ctx)ctx.letterSpacing=(o.ls||0)+"px";
  const str=o.upper?s.toUpperCase():s, lines=o.maxW?wrap(str,o.maxW):[str], lh=o.lh||(o.size||28)*1.2;
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));ctx.restore();return lines.length*lh;}
function wrap(s,maxW){const words=s.split(" "),out=[];let cur="";words.forEach(w=>{const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;});if(cur)out.push(cur);return out;}
const head=(s,x,y,a,o)=>text(s,x,y,Object.assign({font:DISP,weight:700,size:64,upper:true,alpha:a,ls:1},o||{}));
const body=(s,x,y,a,o)=>text(s,x,y,Object.assign({font:BODY,size:30,alpha:a,color:COL.ink},o||{}));
const mono=(s,x,y,a,o)=>text(s,x,y,Object.assign({font:MONO,size:17,alpha:a,color:COL.muted,ls:1},o||{}));
function chapter(n,name,a){mono(n+" · "+name,60,64,a,{upper:true,size:16,ls:3});}
function source(s,a){mono(s,60,1050,a*.9,{size:14,maxW:1500});}
function dot(x,y,r,fill,a,stroke,sw){if(a<=0.001)return;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,6.2832);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw||1.5;ctx.stroke();}ctx.globalAlpha=1;}

/* =================================== DATA =================================== */
const T0=window.TRA, S=T0.summary, SITES=T0.sites.map(d=>Object.assign({},d,{lat:+d.lat,lon:+d.lon}));
const CAMPS=SITES.filter(d=>d.muni==="eThekwini"&&d.fp&&!isNaN(d.lat));
const inBand=d=>d.fp==="inside"||d.fp==="within_250m";
const BASE=FILM.baseline.map(b=>({lat:b[0],lon:b[1],fp:b[2]}));
const campHit=CAMPS.filter(inBand).length, baseHit=BASE.filter(inBand).length;
const WT=window.WORLDTEST, CASES=WT.cases.slice().sort((a,b)=>a.sample_no-b.sample_no);
const test=(f,o)=>WT.tests.find(r=>r.stratum==="all"&&r.factor===f&&r.outcome===o);
console.log("camps",CAMPS.length,"in band",campHit,"| baseline",BASE.length,"in band",baseHit,"| cases",CASES.length);

/* ---------- Durban map space (Web Mercator, 2000 px tall) ---------- */
const BOUNDS={type:"Feature",geometry:{type:"Polygon",coordinates:[[[30.74,-29.53],[31.14,-29.53],[31.14,-30.06],[30.74,-30.06],[30.74,-29.53]]]}};
const MH=2000, pj0=d3.geoMercator().fitSize([100000,MH],BOUNDS), bb0=d3.geoPath(pj0).bounds(BOUNDS);
const proj=pj0.translate([pj0.translate()[0]-bb0[0][0],pj0.translate()[1]-bb0[0][1]]), MW=Math.ceil(bb0[1][0]-bb0[0][0]);
const P=(lon,lat)=>proj([lon,lat]);
const kmPx=(()=>{const a=P(31,-29.8),b=P(31+1/96.4,-29.8);return Math.hypot(b[0]-a[0],b[1]-a[1]);})();   // px per km
const FP=(window.FLOODPLAIN&&FLOODPLAIN.features)||[];
const fpPath=new Path2D(d3.geoPath(proj)({type:"FeatureCollection",features:FP}));
const fpRings=[];FP.forEach(f=>{const g=f.geometry,polys=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];polys.forEach(p=>p.forEach(r=>{const pts=r.map(c=>P(c[0],c[1]));let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);if(L>6)fpRings.push({pts,L});}));});
CAMPS.forEach(d=>{d.m=P(d.lon,d.lat);});BASE.forEach(d=>{d.m=P(d.lon,d.lat);});

/* water raster -> per-pixel occurrence, floodplain mask and distance to the floodplain (for the "drain") */
const waterCv=document.createElement("canvas");waterCv.width=MW;waterCv.height=MH;const wctx=waterCv.getContext("2d");
let WPIX=null, waterImg=null, waterKey="";
function buildWater(img){
  const tmp=document.createElement("canvas");tmp.width=MW;tmp.height=MH;const t=tmp.getContext("2d");
  const a=P(FILM.water.west,FILM.water.north),b=P(FILM.water.east,FILM.water.south);t.imageSmoothingEnabled=false;t.drawImage(img,a[0],a[1],b[0]-a[0],b[1]-a[1]);
  const occ=t.getImageData(0,0,MW,MH).data;
  t.clearRect(0,0,MW,MH);t.fillStyle="#fff";t.fill(fpPath);const mk=t.getImageData(0,0,MW,MH).data;
  const N=MW*MH,dist=new Float32Array(N);for(let i=0;i<N;i++)dist[i]=mk[i*4+3]>100?0:1e9;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=y*MW+x;let v=dist[i];if(!v)continue;if(x>0)v=Math.min(v,dist[i-1]+1);if(y>0){v=Math.min(v,dist[i-MW]+1);if(x>0)v=Math.min(v,dist[i-MW-1]+1.414);if(x<MW-1)v=Math.min(v,dist[i-MW+1]+1.414);}dist[i]=v;}
  for(let y=MH-1;y>=0;y--)for(let x=MW-1;x>=0;x--){const i=y*MW+x;let v=dist[i];if(!v)continue;if(x<MW-1)v=Math.min(v,dist[i+1]+1);if(y<MH-1){v=Math.min(v,dist[i+MW]+1);if(x<MW-1)v=Math.min(v,dist[i+MW+1]+1.414);if(x>0)v=Math.min(v,dist[i+MW-1]+1.414);}dist[i]=v;}
  const idx=[],oc=[],ds=[];for(let i=0;i<N;i++){if(occ[i*4+3]>100&&occ[i*4]>0){idx.push(i);oc.push(occ[i*4]);ds.push(dist[i]);}}
  const outside=ds.filter((d,k)=>d>0&&oc[k]<128).sort((p,q)=>p-q), maxD=outside.length?outside[Math.floor(outside.length*.95)]:1;
  WPIX={idx:Int32Array.from(idx),occ:Uint8Array.from(oc),dn:Float32Array.from(ds.map(d=>Math.min(1,d/maxD)))};
  waterImg=wctx.createImageData(MW,MH);}
function paint(hex,a){const n=parseInt(hex.slice(1),16);return ((Math.round(a*255)&255)<<24)|((n&255)<<16)|((n>>8&255)<<8)|(n>>16);}
const SEA=[...Array(11)].map((_,i)=>paint(COL.sea,i/10)), WET=[...Array(11)].map((_,i)=>paint(COL.water,i/10));
function renderWater(revealPerm,revealInt,drain,ghost){
  const key=[revealPerm,revealInt,drain,ghost].map(v=>v.toFixed(3)).join();if(!WPIX||key===waterKey)return;waterKey=key;
  const buf=new Uint32Array(waterImg.data.buffer);buf.fill(0);
  const tP=lerp(256,128,revealPerm), tI=lerp(128,1,revealInt);
  for(let k=0;k<WPIX.idx.length;k++){const o=WPIX.occ[k];
    if(o>=128){if(o>=tP)buf[WPIX.idx[k]]=SEA[10];continue;}
    if(o<tI)continue;
    const dn=WPIX.dn[k];let a=1;if(dn>0){const p=clamp((drain-(1-dn))/.12);a=lerp(1,ghost,p);}
    buf[WPIX.idx[k]]=WET[Math.round(a*10)];}
  wctx.putImageData(waterImg,0,0);}

/* map transforms: M=[a,b,c,d,e,f]; flat view = scale s, origin (x,y) */
const flat=(s,x,y)=>[s,0,0,s,x,y];
const BASEV=flat(1000/MH,150,40);
function zoomView(mx,my,s,sx,sy){return flat(s,sx-s*mx,sy-s*my);}
function iso(s,cx,cy,k,h){const th=lerp(0,-.72,k),q=lerp(1,.5,k),co=Math.cos(th),si=Math.sin(th);
  const a=s*co,c=-s*si,b=s*si*q,d=s*co*q;return [a,b,c,d,cx-(a*MW/2+c*MH/2),cy-h-(b*MW/2+d*MH/2)];}
const mixM=(A,B,k)=>A.map((v,i)=>lerp(v,B[i],k));
const ap=(M,p)=>[M[0]*p[0]+M[2]*p[1]+M[4],M[1]*p[0]+M[3]*p[1]+M[5]];
let hatch=null;function mkHatch(){const c=document.createElement("canvas");c.width=c.height=14;const x=c.getContext("2d");x.fillStyle=rgba(COL.plain,.28);x.fillRect(0,0,14,14);x.strokeStyle=rgba(COL.plain,.9);x.lineWidth=3;x.beginPath();x.moveTo(-2,16);x.lineTo(16,-2);x.stroke();hatch=ctx.createPattern(c,"repeat");}

function drawMapPlate(M,o){ // o: wet, water, fpOutline(0..1), fpFill, buffer, alpha, plateColor, win (stage clip)
  ctx.save();if(o.win){ctx.setTransform(1,0,0,1,0,0);ctx.beginPath();ctx.rect(o.win[0],o.win[1],o.win[2],o.win[3]);ctx.clip();}
  ctx.setTransform(M[0],M[1],M[2],M[3],M[4],M[5]);ctx.beginPath();ctx.rect(0,0,MW,MH);ctx.clip();ctx.globalAlpha=o.alpha===undefined?1:o.alpha;
  ctx.fillStyle=o.plateColor||(o.wet!==undefined?d3.interpolateRgb(COL.landDry,COL.landWet)(o.wet):COL.landDry);ctx.fillRect(0,0,MW,MH);
  if(o.water){ctx.globalAlpha*=o.water;ctx.imageSmoothingEnabled=true;ctx.drawImage(waterCv,0,0);ctx.globalAlpha=o.alpha===undefined?1:o.alpha;}
  if(o.buffer>0){ctx.globalAlpha=(o.alpha||1)*o.buffer*.35;ctx.strokeStyle=COL.plain;ctx.lineJoin="round";ctx.lineWidth=kmPx*.5;ctx.stroke(fpPath);ctx.globalAlpha=o.alpha===undefined?1:o.alpha;}
  if(o.fpFill>0){ctx.globalAlpha=(o.alpha||1)*o.fpFill;ctx.fillStyle=hatch;ctx.fill(fpPath);ctx.globalAlpha=o.alpha===undefined?1:o.alpha;}
  if(o.fpOutline>0){ctx.strokeStyle=o.fpColor||"#8FD0F5";ctx.lineWidth=(o.fpW||2.4)/Math.hypot(M[0],M[1]);ctx.beginPath();
    fpRings.forEach(r=>{let need=r.L*o.fpOutline,acc=0;ctx.moveTo(r.pts[0][0],r.pts[0][1]);for(let i=1;i<r.pts.length&&acc<need;i++){const a=r.pts[i-1],b=r.pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(acc+l>need){const k=(need-acc)/l;ctx.lineTo(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k);}else ctx.lineTo(b[0],b[1]);acc+=l;}});ctx.stroke();}
  if(o.border!==false){ctx.globalAlpha=(o.alpha||1)*.8;ctx.strokeStyle=COL.rule;ctx.lineWidth=2/Math.hypot(M[0],M[1]);ctx.strokeRect(0,0,MW,MH);}
  ctx.restore();}

/* ---------- South Africa + world ---------- */
const TOPO=window.WORLD_TOPO, COUNTRIES=topojson.feature(TOPO,TOPO.objects.countries).features, LAND=topojson.merge(TOPO,TOPO.objects.countries.geometries);
let ZA=COUNTRIES.find(f=>+f.id===710);if(ZA&&ZA.geometry.type==="MultiPolygon")ZA={type:"Feature",geometry:{type:"MultiPolygon",coordinates:ZA.geometry.coordinates.filter(p=>p[0][0][1]>-36)}};
const saProj=d3.geoMercator().fitExtent([[90,150],[930,960]],ZA), saPath=new Path2D(d3.geoPath(saProj)(ZA));
const SA_SITES=SITES.filter(d=>!isNaN(d.lat));
const GANTT=SITES.filter(d=>/^\d{4}$/.test(d.est)&&/^Active/.test(d.status)&&d.origin!=="covid").map(d=>({n:d.site.replace(/\s*\(.*\)/,"").replace(/ TRA$| transit camp$/,""),m:d.muni.replace(/ \(.*\)/,"").replace("City of ",""),y:+d.est,hit:d.reflood==="yes"})).sort((a,b)=>a.y-b.y||a.n.localeCompare(b.n));
const REFLOOD_ALL=SITES.filter(d=>d.reflood==="yes").length;
const ALIAS={"Democratic Republic of the Congo":"Dem. Rep. Congo","Dominican Republic":"Dominican Rep.","Solomon Islands":"Solomon Is.","São Tomé and Príncipe":"São Tomé and Principe","Bosnia and Herzegovina":"Bosnia and Herz.","Marshall Islands":"Marshall Is."};
const byName={};COUNTRIES.forEach(f=>{if(f.properties&&f.properties.name)byName[f.properties.name]=f;});
const caseByNo={};CASES.forEach(c=>{caseByNo[c.sample_no]=c;});
const FRAME=FILM.frame.map((r,i)=>{let ll=null;
  if(r.s&&caseByNo[r.s]&&caseByNo[r.s].lat!=="")ll=[+caseByNo[r.s].lon,+caseByNo[r.s].lat];
  else{const f=byName[ALIAS[r.c]||r.c];if(f){const c=d3.geoCentroid(f),a=hash(i)*6.283,rr=Math.sqrt(hash(i+999))*1.8;ll=[c[0]+Math.cos(a)*rr,c[1]+Math.sin(a)*rr];}else if(FILM.pts[r.c])ll=[FILM.pts[r.c][1],FILM.pts[r.c][0]];}
  return {ll,e:r.e,s:r.s,i};}).filter(d=>d.ll);
console.log("frame placed",FRAME.length,"of",FILM.frame.length);
function worldProj(k){ // k: 0 = zoomed on South Africa, 1 = whole world
  const full=d3.geoNaturalEarth1().fitExtent([[40,170],[1150,900]],{type:"Sphere"}), s1=full.scale(), t1=full.translate();
  const sZ=s1*6.5, ks=Math.exp(lerp(Math.log(sZ),Math.log(s1),k)), cen=[lerp(25,0,k),lerp(-29,0,k)];
  const p=d3.geoNaturalEarth1().scale(ks).rotate([-cen[0],0]).translate([0,0]), c=p([cen[0],cen[1]]);
  const tx=lerp(510,t1[0],k), ty=lerp(555,t1[1],k);return p.translate([tx-c[0],ty-c[1]]);}

/* ---------- world-test dots and layouts ---------- */
const OUTC={success:COL.ok,mixed:COL.camp,failure:COL.hit};
const outColor=c=>OUTC[c.overall]||null;
const hitColor=c=>c.hazard_at_destination==="exposed_or_hit"?COL.hit:c.hazard_at_destination==="none_reported"?COL.ok:null;
const ORDER_O={failure:0,mixed:1,success:2,unknown:3}, ORDER_H={exposed_or_hit:0,none_reported:1,unknown:2};
function gridL(){const L={};CASES.forEach((c,i)=>{L[c.sample_no]=[1250+(i%8)*60,300+Math.floor(i/8)*60];});return L;}
function columnsL(groupFn,orderFn,xs,baseY,cell,cols){const L={},groups={};
  CASES.forEach(c=>{const g=groupFn(c);(groups[g]=groups[g]||[]).push(c);});
  Object.keys(groups).forEach(g=>{const arr=groups[g].sort((a,b)=>orderFn(a)-orderFn(b)||a.sample_no-b.sample_no), cc=g==="pile"?(cols.pile||12):cols.lane, ce=g==="pile"?cell*.62:cell;
    arr.forEach((c,i)=>{const col=i%cc,row=Math.floor(i/cc);L[c.sample_no]=[xs[g]-(cc-1)*ce/2+col*ce,(g==="pile"?baseY.pile:baseY.lane)-row*ce];});});
  return {L,groups};}
const G_INCOME=c=>c.income_group==="unknown"?"pile":(c.income_group==="High income"||c.income_group==="Upper middle income")?"yes":"no";
const G_OWNER=c=>c.single_owner==="unknown"?"pile":(c.single_owner==="yes"||c.single_owner==="partial")?"yes":"no";
const G_SAY=c=>c.lead==="unknown"?"pile":(c.lead==="gov_community_joint"||c.lead==="community_initiated")?"yes":"no";
const G_HAZ=c=>c.hazard_binding==="unknown"?"pile":(c.hazard_binding==="yes"||c.hazard_binding==="partial")?"yes":"no";
const oO=c=>ORDER_O[c.overall]===undefined?3:ORDER_O[c.overall], oH=c=>ORDER_H[c.hazard_at_destination]===undefined?2:ORDER_H[c.hazard_at_destination];
const SUS_X={yes:700,no:1150,pile:1640}, GATE_X={yes:620,no:1300,pile:960};
const L_GRID=gridL();

const TOTAL=acc;

/* =================================== PLAYER =================================== */
let T=0,playing=false,last=0;
function frame(Tg){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);
  SC.forEach(s=>{if(Tg>=s.a&&Tg<s.b){ctx.save();s.draw(Tg-s.a,Tg);ctx.restore();}});}
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

playB.addEventListener("click",()=>{if(!playing&&T>=TOTAL-.02)T=0;play(!playing);});

addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"&&e.key!==" ")return;if(e.key===" "){e.preventDefault();play(!playing);}if(e.key==="ArrowRight")seek(T+5);if(e.key==="ArrowLeft")seek(T-5);});

.then(()=>{mkHatch();try{buildWater(img);}catch(err){console.warn("water raster unavailable",err);}
  const q=/[?&]t=([\d.]+)/.exec(location.search), hashS=/^#(\w+)$/.exec(location.hash);
